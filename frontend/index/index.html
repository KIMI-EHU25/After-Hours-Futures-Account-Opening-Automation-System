<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜盘开户</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <main class="welcome-shell">
        <section class="welcome-card">
            <p class="eyebrow">OPEN ACCOUNT</p>
            <h1>夜盘开户</h1>
            <p class="description">
                接下来需要依次填写反洗钱信息、基本资料、交易者风险测评和期货品种选择。
                请根据实际情况完成所有内容。
            </p>

            <ol class="step-list">
                <li>反洗钱信息</li>
                <li>基本资料</li>
                <li>交易者风险测评</li>
                <li>期货品种选择</li>
                <li>查看提交结果</li>
            </ol>

            <button id="start-button" class="start-button" type="button">
                开始填写
            </button>
        </section>
    </main>
    <script type="module" src="./index.js"></script>
</body>
</html>
